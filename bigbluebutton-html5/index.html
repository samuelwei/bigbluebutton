<head>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta charset="utf-8">
  <!-- Block browser auto-translation: translators (e.g. Google Translate) rewrite
       text nodes out from under React, desyncing the virtual DOM and crashing the
       client (insertBefore NotFoundError) on the next render. Use in-app i18n. -->
  <meta name="google" content="notranslate">
  <script>document.documentElement.setAttribute('translate', 'no');</script>
  <script>
    // Applies the persisted theme before the first paint. Two key spellings on purpose:
    // the session adapter prefixes 'BBB_' and the local one 'BBB', so a deployment with
    // userSettingsStorage: local writes 'BBBchanged_settings_application'. The prefix
    // asymmetry is pre-existing and must not be normalised here -- that would orphan
    // every already-persisted setting. The gate is 'darkTheme' in changed, not
    // truthiness, because Settings.save() writes {} unconditionally and an empty object
    // would otherwise be taken as authoritative and stop the search.
    (function applyPersistedTheme() {
      var keys = ['BBB_changed_settings_application', 'BBBchanged_settings_application'];
      var stores;
      try {
        stores = [window.sessionStorage, window.localStorage];
      } catch (e) {
        return;
      }
      for (var i = 0; i < stores.length; i += 1) {
        for (var j = 0; j < keys.length; j += 1) {
          var changed = null;
          try {
            var raw = stores[i] && stores[i].getItem(keys[j]);
            changed = raw ? JSON.parse(raw) : null;
          } catch (e) {
            changed = null;
          }
          if (changed && typeof changed === 'object' && 'darkTheme' in changed) {
            if (changed.darkTheme === true) {
              document.documentElement.setAttribute('data-theme', 'dark');
            }
            return;
          }
        }
      }
      // Nothing persisted: anticipate the shipped default, darkTheme.autoDetectFromSystem
      // true, so an OS-dark user does not get a light first paint. A deployment that turns
      // autoDetectFromSystem off trades this for a dark flash instead; the default config
      // is the common case, and the server's defaultSettings cannot be known pre-paint.
      try {
        if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      } catch (e) { /* matchMedia unavailable: leave the first paint light */ }
    })();
  </script>

  <style>
    html {
      box-sizing: border-box;
    }

    *, *:before, *:after {
      box-sizing: inherit;
    }

    body {
      position: fixed;
      height: 100%;
      font-family: 'Source Sans Pro', Arial, sans-serif;
      font-size: 1rem; /* 16px */
      background-color: var(--color-background, #102133);
    }

    /* language-specific font */
    body.lang-fa {
      font-family: Tahoma, 'Source Sans Pro', Arial, sans-serif;
    }

    :-webkit-full-screen {
      background-color: inherit;
    }

    a {
      color: inherit;
    }

    #app {
      height: 100%;
      width: 100vw;
      overflow: hidden;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0,0,0,0);
      border: 0;
    }

    .set-z-index {
      z-index: 15;
      width: 100% !important;
      height: 100% !important;
    }

    .remove-z-index {
      z-index: 0;
    }
    /* .full-screen {
      height: 100% !important;
      width: 100% !important;
      transform: translateX(0) translateY(0) translateZ(0) !important;
    } */

    [hidden]:not([hidden="false"]) {
      display: none !important;
    }

    ::-webkit-input-placeholder {
      color: var(--palette-placeholder-text, #787675);
      opacity: 1;
    }

    :-moz-placeholder, /* Firefox 4 to 18 */
    ::-moz-placeholder { /* Firefox 19+ */
      color: var(--palette-placeholder-text, #787675);
      opacity: 1;
    }

    main {
      display: initial;
    }

    .overrideSelect {
      background-color: var(--color-white-surface, var(--color-white, #FFF)) !important;
      color: var(--color-black, #000) !important;
    }

    .select {
      background-color: rgba(66, 133, 244, 1) !important;
      color: #FFF !important;
    }

    .fade-in {
      opacity: 1 !important;
    }

    .fade-out {
      opacity: 0 !important;
    }

    .browserWarning {
      border: 5px solid var(--color-off-white-border, var(--color-off-white, #F3F6F9));
      border-radius: 0.5rem;
      color: var(--color-off-white-text, var(--color-off-white, #F3F6F9));
      text-align: center;
      width: 500px;
      position: fixed;
      left: 50%;
      margin-left: -250px;
      top: 50%;
      margin-top: -4rem;
      font-size: 1.5rem;
      padding: 10px;
      font-family: 'Source Sans Pro', Arial, sans-serif;
    }

    @media only screen and (max-width: 40em) {
      .browserWarning {
        width: 95%;
        left: 2.5%;
        margin-left: 0;
      }
    }
  </style>

  <svg style="display: none; width: 1px; height: 1px;">
    <defs>
      <g id="redPointer">
        <circle cx="0" cy="0" r="60" fill="red" />
      </g>
    </defs>
  </svg>
  <main>
    <div id="app" role="document"></div>
  </main>
  <!--
    Classic boot owns the browser gate and loads the client module.
    BBB_ENTRY_URL: dev → /html5client/client/main.tsx (transformIndexHtml);
    prod → ./bundle.[hash].js (emit-html plugin). No Vite module tag here —
    that avoids strip/reinject and stays thin-client-boot compatible.
  -->
  <script>window.__BBB_ENTRY__ = '__BBB_ENTRY_URL__';</script>
  <script src="boot.js"></script>
  <span id="destination"></span>
  <audio id="remote-media"></audio>
  <audio id="local-media"></audio>
  <div id="modals-container"></div>
  <div id="polling-container"></div>
</body>
